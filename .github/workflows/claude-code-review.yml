name: Claude Code Review

# PR을 열거나 초안에서 준비 완료로 바꿀 때 한 번 리뷰합니다. 푸시마다 돌리지 않아 구독 사용량을 아낍니다.
# 고친 뒤 다시 보려면 PR에 `@claude`로 요청합니다(claude.yml). 리뷰 기준은 CLAUDE.md의 "PR 리뷰"입니다.
on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 플러그인(code-review@claude-code-plugins)은 영어 고정 형식이고 막음/후속이 없으며, #73에서 서브에이전트
          # 없이 23초 만에 끝나 리뷰를 믿을 수 없었습니다. CLAUDE.md의 기준을 직접 지시합니다.
          prompt: |
            저장소: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }}

            이 PR을 리뷰합니다. 기준은 CLAUDE.md의 "PR 리뷰"입니다.

            1. CLAUDE.md를 읽습니다. `gh pr view ${{ github.event.pull_request.number }}`로 본문을 읽고, 본문의
               `Closes #N`이나 언급한 이슈를 `gh issue view`로 읽어 요구한 것을 정리합니다.
            2. `gh pr diff ${{ github.event.pull_request.number }}`로 변경 전체를 읽습니다. 바뀐 파일마다, 그 도메인의
               설계 문서(docs/design/)와 CLAUDE.md "읽을 문서"가 가리키는 문서 중 이 변경에 해당하는 것을 읽습니다.
               판정에 필요하면 저장소의 다른 코드도 Read·Grep으로 읽습니다.
            3. 바뀐 파일을 하나씩 모두 봅니다. 다음을 찾습니다.
               - 버그, 데이터·돈 기록이 어긋날 수 있는 동시성 문제
               - 도메인 문서·conventions.md·domain-model.md와 어긋나는 코드
               - 동작을 바꾸고 도메인 문서나 docs/reference/openapi.json을 고치지 않은 것
               - 이슈가 요구했는데 빠진 것
               - 그 밖에 고치면 나은 것
            4. 지적마다 코드로 다시 확인합니다. 확인하지 못한 것은 버리거나 "확인 못 함"이라고 적습니다.
               이 PR이 만들지 않은 기존 문제, 포매터·타입 검사가 잡는 것은 지적하지 않습니다.
            5. 확인한 지적은 그 줄에 `mcp__github_inline_comment__create_inline_comment`로 남깁니다. 지적마다 처음에
               **막음** 또는 **후속**을 붙입니다(기준은 CLAUDE.md). 무엇이 어떤 입력에서 어떻게 틀리는지와 근거
               문서·코드를 적습니다. 같은 문제는 한 번만 남깁니다.
            6. 마지막에 `gh pr comment`로 요약을 하나 남깁니다. 읽은 문서와 이슈, 본 파일 수, 막음·후속 개수와 한 줄씩
               요약을 적습니다. 지적이 없으면 무엇을 확인했는지 적습니다.

            모든 리뷰 글은 한국어로 씁니다. 식별자·오류 코드·이벤트 타입은 영어 그대로 씁니다.
          claude_args: |
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*)"
